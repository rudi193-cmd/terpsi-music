name: tests

# The guards in tests/ are stdlib-only, need no database and no network, and
# until this file existed they ran only when somebody remembered. ARCHITECTURE
# §7.2's distinction applies to a test suite as much as to a gate: unrun, it is
# a ledger of intentions.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The one dependency, pinned in requirements.txt with its reason
      # (§18 item 15, decided 2026-07-31). Installed from that file only, so
      # what CI pulls and what the file declares cannot drift apart.
      - name: Install the declared dependency
        run: python3 -m pip install -r requirements.txt

      # Run each file directly rather than under pytest. The suite is written
      # to work both ways (see each module's __main__ block). The workflow was
      # dependency-free until 2026-07-31, on purpose; it now installs exactly
      # the requirements file and nothing else — the posture is unchanged, the
      # set is one element larger, and the reason is written where the pin is.
      - name: Run guards
        run: |
          status=0
          for f in tests/test_*.py; do
            echo "=== $f"
            python3 "$f" || status=1
          done
          exit $status

      # The declaration, reconciled against the source, in THIS repository's
      # CI. §18 item 4's closing note makes it an obligation of the first
      # surfaces commit, and the reason it is not the store's job is measured:
      # the store's lint errors on a missing manifest only for entries carrying
      # a local path, so an external-repo app falls between the declaration
      # surface and the enforcement surface. Exit 2 is the vacuous case --
      # nothing checked -- and it fails here too, because a check that checked
      # nothing must not pass a build.
      - name: The manifest, against the tree
        run: python3 tools/manifest.py

      # The template/rendered pair's named middle (rule 12). A repaint that was
      # not regenerated, or a generated file edited by hand, fails here.
      - name: Rendered artifacts match their templates
        run: python3 presentation/render.py --check

      # Runnable artifacts a document derives a claim from. scout-13's mutation
      # table is the case: it is the one result in the survey derived by running
      # code rather than by citation, so leaving it out of CI would put it back
      # in the state tests/test_claimed_artifacts.py exists to catch -- present
      # in the tree, and never executed.
      - name: Run claimed artifacts
        run: |
          status=0
          for f in docs/survey/*.py; do
            echo "=== $f"
            python3 "$f" || status=1
          done
          exit $status

  # The DDL is text-checked by the suite above. This runs it, because a schema
  # that has never been executed is a claim. Every constraint the lane model
  # rests on is then attacked directly -- §10: acceptance is mutation, not a
  # green suite, and every invariant needs a test that attempts the forbidden
  # act and asserts refusal.
  #
  # `refuse` takes the guard the error must NAME, not just the fact of a
  # refusal. A BEFORE ROW trigger fires ahead of every CHECK, NOT NULL and
  # foreign key on the same row, so an attack that only asserts "this was
  # refused" can be satisfied by a guard other than the one under test -- which
  # happened here on the first run, and is EXTERNAL-ARM.md's "a gate green
  # because a different constraint was catching it".
  schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ["5432:5432"]
    env:
      PGPASSWORD: postgres
      PSQL: psql -h localhost -U postgres -d postgres
    steps:
      - uses: actions/checkout@v4

      - name: Apply the migration
        run: $PSQL -v ON_ERROR_STOP=1 -q -f migrations/001_lanes.sql

      - name: Every column is classified
        run: |
          $PSQL -v ON_ERROR_STOP=1 -q -c "
            DO \$\$
            DECLARE missing int;
            BEGIN
              SELECT count(*) INTO missing
              FROM information_schema.columns c
              WHERE c.table_schema = 'public'
                AND NOT EXISTS (
                  SELECT 1 FROM field_classification f
                  WHERE f.table_name = c.table_name
                    AND f.column_name = c.column_name);
              IF missing > 0 THEN
                RAISE EXCEPTION '% columns have no classification', missing;
              END IF;
            END \$\$;"

      - name: Forbidden acts are refused, by the guard that names them
        run: |
          BEN=11111111-1111-1111-1111-111111111111
          CARA=11111111-2222-2222-2222-222222222222
          ANN=11111111-3333-3333-3333-333333333333
          NGUYEN=11111111-4444-4444-4444-444444444444
          LBEN=22222222-1111-1111-1111-111111111111
          LCARA=22222222-2222-2222-2222-222222222222
          LANN=22222222-3333-3333-3333-333333333333
          LNGU=22222222-4444-4444-4444-444444444444
          ENS=aaaa1111-1111-1111-1111-111111111111
          GBEN=dddddddd-1111-1111-1111-111111111111
          GCARA=dddddddd-2222-2222-2222-222222222222
          SNGU=dddddddd-3333-3333-3333-333333333333
          GOLD=dddddddd-5555-5555-5555-555555555555
          E="INSERT INTO crossing_envelope VALUES"
          W="INSERT INTO self_widening VALUES"

          seed() {
            for p in "$BEN 2010-05-01" "$CARA 2012-09-14" "$ANN 1979-02-02" "$NGUYEN 1988-11-30"; do
              set -- $p
              $PSQL -q -c "INSERT INTO person VALUES ('$1','$2',now(),now(),NULL)"
            done
            for l in "$LBEN $BEN" "$LCARA $CARA" "$LANN $ANN" "$LNGU $NGUYEN"; do
              set -- $l
              $PSQL -q -c "INSERT INTO lane VALUES ('$1','$2','keys at majority',now(),now(),now(),NULL)"
            done
            $PSQL -q -c "INSERT INTO scope_object VALUES ('$ENS','Ensemble','Drumline',now(),now(),NULL)"
            $PSQL -q -c "INSERT INTO edge VALUES ('$GBEN','guardian_of','$ANN','$LBEN',NULL,'enrolment form',now(),now() - interval '1 year',NULL)"
            $PSQL -q -c "INSERT INTO edge VALUES ('$GCARA','guardian_of','$ANN','$LCARA',NULL,'enrolment form',now(),now() - interval '1 year',NULL)"
            $PSQL -q -c "INSERT INTO edge VALUES ('$SNGU','staff_of','$NGUYEN',NULL,'$ENS','staff roster',now(),now(),NULL)"
            # guardianship ended by a date, never by a delete (refusal 3)
            $PSQL -q -c "INSERT INTO edge VALUES ('$GOLD','guardian_of','$NGUYEN','$LBEN',NULL,'court order',now(),now() - interval '2 year',now() - interval '1 year')"
            $PSQL -q -c "INSERT INTO disclosure_log
              (occurred_at,principal_id,lane_id,what,recipient,authority,hash)
              VALUES (now(),'$ANN','$LBEN','roster','district','grant x','\\x00')"
          }

          # refuse <label> <the guard the error must name> <sql>
          #
          # `|| true` is load-bearing. A step runs under `bash -e`, and a plain
          # assignment from a command substitution carries that command's exit
          # status -- so `err=$(psql ...)` aborts the whole step on the FIRST
          # refusal, which is every case here. The step then ends silently at
          # the first attack, having asserted nothing, and reads as a pass in
          # the log until someone counts the lines.
          refuse() {
            err=$($PSQL -v ON_ERROR_STOP=1 -q -c "$3" 2>&1) || true
            if [ -z "$err" ]; then
              echo "NOT REFUSED: $1"; exit 1
            fi
            if ! printf '%s' "$err" | grep -q -- "$2"; then
              echo "REFUSED BY THE WRONG GUARD: $1"
              echo "   wanted: $2"
              echo "   got:    $(printf '%s' "$err" | head -1)"
              exit 1
            fi
            echo "refused by $2: $1"
          }

          seed

          # --- the first twelve tables --------------------------------------
          refuse "blank exit_terms (W-6)" lane_exit_terms_present \
            "INSERT INTO lane VALUES ('44444444-4444-4444-4444-444444444444','$CARA','   ',now(),now(),now(),NULL)"
          refuse "a grant at L5" access_grant_max_rung \
            "INSERT INTO access_grant VALUES ('55555555-5555-5555-5555-555555555555','$ANN','$LBEN','$GBEN','L5','x','$ANN',now(),now(),now(),NULL)"
          refuse "a lane_entry with no lane (W-1)" 'null value in column "lane_id"' \
            "INSERT INTO lane_entry VALUES ('77777777-7777-7777-7777-777777777777',NULL,NULL,'attendance','{}'::jsonb,'$ANN','draft',NULL,now(),now(),NULL)"
          refuse "sealed with no sealer" lane_entry_sealed_has_sealer \
            "INSERT INTO lane_entry VALUES ('88888888-8888-8888-8888-888888888888','$LBEN',NULL,'commentary','{}'::jsonb,'$ANN','sealed',NULL,now(),now(),NULL)"
          refuse "an edge with neither target set" edge_exactly_one_target \
            "INSERT INTO edge VALUES ('dddddddd-3333-3333-3333-333333333333','staff_of','$NGUYEN',NULL,NULL,'import',now(),now(),NULL)"
          refuse "an edge pointing at a scope that does not exist" edge_target_scope_id_fkey \
            "INSERT INTO edge VALUES ('dddddddd-1111-2222-3333-444444444444','staff_of','$NGUYEN',NULL,'ffffffff-dead-dead-dead-ffffffffffff','import',now(),now(),NULL)"
          refuse "rewriting the disclosure log" 'append-only' \
            "UPDATE disclosure_log SET what = 'nothing happened'"
          refuse "deleting from the disclosure log" 'append-only' \
            "DELETE FROM disclosure_log"

          # --- the thirteenth table: W-3's crossing envelope ----------------
          refuse "an envelope naming one lane twice" crossing_envelope_names_two_lanes \
            "$E ('cccc0001-0000-0000-0000-000000000000','$LBEN','$LBEN','sibling carpool','$ANN','$GBEN',now(),now()+interval '30 day',now(),now(),NULL)"
          # approached through from_lane_id: the signature trigger reads
          # to_lane_id, and a BEFORE ROW trigger fires ahead of NOT NULL.
          refuse "an envelope naming only one lane" 'null value in column "from_lane_id"' \
            "$E ('cccc0002-0000-0000-0000-000000000000',NULL,'$LBEN','sibling carpool','$ANN','$GBEN',now(),now()+interval '30 day',now(),now(),NULL)"
          refuse "an envelope scoped to an ensemble rather than a lane (refusal 5)" crossing_envelope_from_lane_id_fkey \
            "$E ('cccc0003-0000-0000-0000-000000000000','$ENS','$LBEN','the drumline','$ANN','$GBEN',now(),now()+interval '30 day',now(),now(),NULL)"
          refuse "an envelope with a blank purpose" crossing_envelope_purpose_present \
            "$E ('cccc0004-0000-0000-0000-000000000000','$LCARA','$LBEN','   ','$ANN','$GBEN',now(),now()+interval '30 day',now(),now(),NULL)"
          refuse "an envelope with no future expiry" crossing_envelope_expiry_is_future \
            "$E ('cccc0005-0000-0000-0000-000000000000','$LCARA','$LBEN','sibling carpool','$ANN','$GBEN',now(),now(),now(),now(),NULL)"
          refuse "an envelope signed by staff, not a guardian" 'held no live guardian_of edge' \
            "$E ('cccc0006-0000-0000-0000-000000000000','$LCARA','$LBEN','sibling carpool','$NGUYEN','$SNGU',now(),now()+interval '30 day',now(),now(),NULL)"
          refuse "an envelope signed by a guardian whose standing had ended" 'held no live guardian_of edge' \
            "$E ('cccc0007-0000-0000-0000-000000000000','$LCARA','$LBEN','sibling carpool','$NGUYEN','$GOLD',now(),now()+interval '30 day',now(),now(),NULL)"
          refuse "an envelope invalidated before it was valid" crossing_envelope_dates \
            "$E ('cccc0008-0000-0000-0000-000000000000','$LCARA','$LBEN','sibling carpool','$ANN','$GBEN',now(),now()+interval '30 day',now(),now(),now()-interval '1 day')"

          # --- the fourteenth table: W-5's widening -------------------------
          refuse "a widening over every category (refusal 5)" self_widening_category_is_a_name \
            "$W ('bbbb0001-0000-0000-0000-000000000000','$BEN','*','handover','L4','$ANN','$GBEN',now(),now()+interval '30 day',now(),now(),NULL)"
          refuse "a widening over 'all' (refusal 5)" self_widening_category_is_a_name \
            "$W ('bbbb0002-0000-0000-0000-000000000000','$BEN','ALL','handover','L4','$ANN','$GBEN',now(),now()+interval '30 day',now(),now(),NULL)"
          refuse "a widening with a blank category" self_widening_category_present \
            "$W ('bbbb0003-0000-0000-0000-000000000000','$BEN','  ','handover','L4','$ANN','$GBEN',now(),now()+interval '30 day',now(),now(),NULL)"
          refuse "a widening to L5" self_widening_max_rung \
            "$W ('bbbb0004-0000-0000-0000-000000000000','$BEN','psychological_evaluation','handover','L5','$ANN','$GBEN',now(),now()+interval '30 day',now(),now(),NULL)"
          refuse "a widening with no future expiry" self_widening_expiry_is_future \
            "$W ('bbbb0007-0000-0000-0000-000000000000','$BEN','psychological_evaluation','handover','L4','$ANN','$GBEN',now(),now(),now(),now(),NULL)"
          refuse "a widening signed by staff, not a guardian" 'held no live guardian_of edge' \
            "$W ('bbbb0006-0000-0000-0000-000000000000','$BEN','psychological_evaluation','handover','L4','$NGUYEN','$SNGU',now(),now()+interval '30 day',now(),now(),NULL)"
          refuse "a widening with no signature at all" 'held no live guardian_of edge' \
            "$W ('bbbb0008-0000-0000-0000-000000000000','$BEN','psychological_evaluation','handover','L4',NULL,'$GBEN',now(),now()+interval '30 day',now(),now(),NULL)"

          # --- the edge trigger, both directions of the equivalence ---------
          refuse "a forged self edge (§18 item 12)" 'must be the lane' \
            "INSERT INTO edge VALUES ('dddddddd-9999-9999-9999-999999999999','self','$NGUYEN','$LBEN',NULL,'import',now(),now(),NULL)"
          refuse "a self edge pointing at a scope rather than a lane" 'must be the lane' \
            "INSERT INTO edge VALUES ('dddddddd-8888-8888-8888-888888888888','self','$BEN',NULL,'$ENS','import',now(),now(),NULL)"
          refuse "a ward holding guardianship over its own lane (W-4)" 'ward authorizing itself' \
            "INSERT INTO edge VALUES ('dddddddd-6666-6666-6666-666666666666','guardian_of','$BEN','$LBEN',NULL,'import',now(),now(),NULL)"

          # --- W-4's CHECK, with the guard in front of it removed -----------
          # self_widening_ward_cannot_sign_its_own cannot be reached while the
          # edge trigger stands, because signed_by = subject_id requires the
          # ward to hold guardian_of over its own lane first. Disabling the
          # signature trigger is how it gets shown to fire at all; a constraint
          # nobody has seen fire has not been shown to work (rule 19).
          $PSQL -q -c "ALTER TABLE self_widening DISABLE TRIGGER self_widening_guardian_signed"
          refuse "a widening the ward signed for itself (W-4)" self_widening_ward_cannot_sign_its_own \
            "$W ('bbbb0005-0000-0000-0000-000000000000','$BEN','psychological_evaluation','I want to read it','L4','$BEN','$GBEN',now(),now()+interval '30 day',now(),now(),NULL)"
          $PSQL -q -c "ALTER TABLE self_widening ENABLE TRIGGER self_widening_guardian_signed"

      - name: A guard that refuses everything is not a guard
        run: |
          ANN=11111111-3333-3333-3333-333333333333
          BEN=11111111-1111-1111-1111-111111111111
          NGUYEN=11111111-4444-4444-4444-444444444444
          LBEN=22222222-1111-1111-1111-111111111111
          LCARA=22222222-2222-2222-2222-222222222222
          ENS=aaaa1111-1111-1111-1111-111111111111
          GBEN=dddddddd-1111-1111-1111-111111111111
          land() {
            $PSQL -v ON_ERROR_STOP=1 -q -c "$2" || { echo "WRONGLY REFUSED: $1"; exit 1; }
            echo "landed: $1"
          }
          land "a staff edge onto an ensemble" \
            "INSERT INTO edge VALUES ('dddddddd-4444-4444-4444-444444444444','staff_of','$NGUYEN',NULL,'$ENS','import',now(),now(),NULL)"
          land "a genuine self edge" \
            "INSERT INTO edge VALUES ('dddddddd-7777-7777-7777-777777777777','self','$BEN','$LBEN',NULL,'enrolment',now(),now(),NULL)"
          land "a genuine sibling crossing envelope" \
            "INSERT INTO crossing_envelope VALUES ('cccc9999-0000-0000-0000-000000000000','$LCARA','$LBEN','shared ride home after the away game','$ANN','$GBEN',now(),now()+interval '30 day',now(),now(),NULL)"
          land "a genuine per-category widening" \
            "INSERT INTO self_widening VALUES ('bbbb9999-0000-0000-0000-000000000000','$BEN','psychological_evaluation','handover to the new counsellor','L4','$ANN','$GBEN',now(),now()+interval '30 day',now(),now(),NULL)"
          land "revoking the envelope by dating it closed, not by deleting it (refusal 3)" \
            "UPDATE crossing_envelope SET invalid_at = now() WHERE envelope_id = 'cccc9999-0000-0000-0000-000000000000'"
          land "revoking the widening the same way" \
            "UPDATE self_widening SET invalid_at = now() WHERE widening_id = 'bbbb9999-0000-0000-0000-000000000000'"
          test "$($PSQL -At -c 'SELECT count(*) FROM disclosure_log')" = "1" \
            || { echo "the disclosure log did not survive the attacks"; exit 1; }
          echo "legitimate writes still land; the log is intact"
