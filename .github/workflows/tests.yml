name: tests

# The guards in tests/ are stdlib-only, need no database and no network, and
# until this file existed they ran only when somebody remembered. ARCHITECTURE
# §7.2's distinction applies to a test suite as much as to a gate: unrun, it is
# a ledger of intentions.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Run each file directly rather than under pytest. The suite is written
      # to work both ways (see each module's __main__ block) and this keeps the
      # workflow dependency-free, which matters for a repo whose whole posture
      # is about what it does and does not pull in.
      - name: Run guards
        run: |
          status=0
          for f in tests/test_*.py; do
            echo "=== $f"
            python3 "$f" || status=1
          done
          exit $status

      # The declaration, reconciled against the source, in THIS repository's
      # CI. §18 item 4's closing note makes it an obligation of the first
      # surfaces commit, and the reason it is not the store's job is measured:
      # the store's lint errors on a missing manifest only for entries carrying
      # a local path, so an external-repo app falls between the declaration
      # surface and the enforcement surface. Exit 2 is the vacuous case --
      # nothing checked -- and it fails here too, because a check that checked
      # nothing must not pass a build.
      - name: The manifest, against the tree
        run: python3 tools/manifest.py

      # The template/rendered pair's named middle (rule 12). A repaint that was
      # not regenerated, or a generated file edited by hand, fails here.
      - name: Rendered artifacts match their templates
        run: python3 presentation/render.py --check

      # Runnable artifacts a document derives a claim from. scout-13's mutation
      # table is the case: it is the one result in the survey derived by running
      # code rather than by citation, so leaving it out of CI would put it back
      # in the state tests/test_claimed_artifacts.py exists to catch -- present
      # in the tree, and never executed.
      - name: Run claimed artifacts
        run: |
          status=0
          for f in docs/survey/*.py; do
            echo "=== $f"
            python3 "$f" || status=1
          done
          exit $status

  # The DDL is text-checked by the suite above. This runs it, because a schema
  # that has never been executed is a claim. Every constraint the lane model
  # rests on is then attacked directly -- §10: acceptance is mutation, not a
  # green suite, and every invariant needs a test that attempts the forbidden
  # act and asserts refusal.
  schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ["5432:5432"]
    env:
      PGPASSWORD: postgres
      PSQL: psql -h localhost -U postgres -d postgres
    steps:
      - uses: actions/checkout@v4

      - name: Apply the migration
        run: $PSQL -v ON_ERROR_STOP=1 -q -f docs/schema/001_lanes.proposed.sql

      - name: Every column is classified
        run: |
          $PSQL -v ON_ERROR_STOP=1 -q -c "
            DO \$\$
            DECLARE missing int;
            BEGIN
              SELECT count(*) INTO missing
              FROM information_schema.columns c
              WHERE c.table_schema = 'public'
                AND NOT EXISTS (
                  SELECT 1 FROM field_classification f
                  WHERE f.table_name = c.table_name
                    AND f.column_name = c.column_name);
              IF missing > 0 THEN
                RAISE EXCEPTION '% columns have no classification', missing;
              END IF;
            END \$\$;"

      - name: Forbidden acts are refused
        run: |
          seed() {
            $PSQL -q -c "INSERT INTO person VALUES
              ('11111111-1111-1111-1111-111111111111','2010-05-01',now(),now(),NULL)"
            $PSQL -q -c "INSERT INTO lane VALUES
              ('22222222-2222-2222-2222-222222222222',
               '11111111-1111-1111-1111-111111111111','keys at majority',
               now(),now(),now(),NULL)"
            $PSQL -q -c "INSERT INTO disclosure_log
              (occurred_at,principal_id,lane_id,what,recipient,authority,hash)
              VALUES (now(),'11111111-1111-1111-1111-111111111111',
                      '22222222-2222-2222-2222-222222222222',
                      'roster','district','grant x','\\x00')"
          }
          refuse() {
            if $PSQL -v ON_ERROR_STOP=1 -q -c "$2" >/dev/null 2>&1; then
              echo "NOT REFUSED: $1"; exit 1
            fi
            echo "refused: $1"
          }
          seed
          refuse "blank exit_terms (W-6)" \
            "INSERT INTO lane VALUES ('44444444-4444-4444-4444-444444444444','11111111-1111-1111-1111-111111111111','   ',now(),now(),now(),NULL)"
          refuse "a grant at L5" \
            "INSERT INTO access_grant VALUES ('55555555-5555-5555-5555-555555555555','11111111-1111-1111-1111-111111111111','22222222-2222-2222-2222-222222222222',NULL,'L5','x','11111111-1111-1111-1111-111111111111',now(),now(),now(),NULL)"
          refuse "a lane_entry with no lane (W-1)" \
            "INSERT INTO lane_entry VALUES ('77777777-7777-7777-7777-777777777777',NULL,NULL,'attendance','{}'::jsonb,'11111111-1111-1111-1111-111111111111','draft',NULL,now(),now(),NULL)"
          refuse "sealed with no sealer" \
            "INSERT INTO lane_entry VALUES ('88888888-8888-8888-8888-888888888888','22222222-2222-2222-2222-222222222222',NULL,'commentary','{}'::jsonb,'11111111-1111-1111-1111-111111111111','sealed',NULL,now(),now(),NULL)"
          refuse "an edge with neither target set" \
            "INSERT INTO edge VALUES ('dddddddd-3333-3333-3333-333333333333','staff_of','11111111-1111-1111-1111-111111111111',NULL,NULL,'import',now(),now(),NULL)"
          refuse "an edge pointing at a scope that does not exist" \
            "INSERT INTO edge VALUES ('dddddddd-1111-1111-1111-111111111111','staff_of','11111111-1111-1111-1111-111111111111',NULL,'ffffffff-dead-dead-dead-ffffffffffff','import',now(),now(),NULL)"
          refuse "rewriting the disclosure log" \
            "UPDATE disclosure_log SET what = 'nothing happened'"
          refuse "deleting from the disclosure log" \
            "DELETE FROM disclosure_log"

      - name: A guard that refuses everything is not a guard
        run: |
          $PSQL -v ON_ERROR_STOP=1 -q -c "INSERT INTO scope_object VALUES
            ('aaaa1111-1111-1111-1111-111111111111','Ensemble','Drumline',now(),now(),NULL)"
          $PSQL -v ON_ERROR_STOP=1 -q -c "INSERT INTO edge VALUES
            ('dddddddd-4444-4444-4444-444444444444','staff_of',
             '11111111-1111-1111-1111-111111111111',NULL,
             'aaaa1111-1111-1111-1111-111111111111','import',now(),now(),NULL)"
          test "$($PSQL -At -c 'SELECT count(*) FROM disclosure_log')" = "1" \
            || { echo "the disclosure log did not survive the attacks"; exit 1; }
          echo "legitimate writes still land; the log is intact"
